[project]
name = "graph-web"
version = "0.1.0"
description = "An adk-web style developer playground for arbitrary LangGraph projects."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

# NOTE: langgraph / langchain are NOT listed here. graph-web is meant to run
# *inside the target project's virtualenv*, which already provides them.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphweb"]
